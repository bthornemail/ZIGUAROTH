"CONFIGURATION":
  title: "ZIGUAROTH: the rules for building the codex"
  status: "draft, 2026-10-25"
  author: "Brian James Thorne"
  principle: "the author, 2026-10-25: the goal is to preserve nesting, because strict logic can only be exposed through nesting"
  tier: "-6, CONFIGURATIONS: _ARCHIVE/Configurations, *.yaml"

  keywords:
    basis: "RFC 2119 (BCP 14), as clarified by RFC 8174: the keywords carry their special meaning only in capitals. Each keyword has three faces from the author's projects: what it requires (RFC 2119), what a broken rule is (omnicron org/MODAL-VERIFICATION.org), and, as the author's reading, the agreement it stands for (rfcXXXX src/phase1-geometric-consensus)."
    "MUST":
      requires: "an absolute requirement; REQUIRED and SHALL mean the same"
      broken: "violation"
      agreement: "unanimous: tetrahedron 4/4, 5-cell 5/5, truncated tetrahedron 12/12"
    "MUST_NOT":
      requires: "an absolute prohibition; SHALL NOT means the same"
      broken: "violation"
    "SHOULD":
      requires: "recommended; there may be good reasons to do otherwise, but the full implications must be understood and weighed first; RECOMMENDED means the same"
      broken: "warning"
      agreement: "strong: octahedron 5/6, 24-cell 20/24, cuboctahedron 10/12"
    "SHOULD_NOT":
      requires: "not recommended; there may be good reasons to do it, but the full implications must be understood and weighed first"
      broken: "warning"
    "MAY":
      requires: "truly optional; OPTIONAL means the same"
      broken: "note"
      agreement: "majority: cube 4/8, 8-cell 8/16, truncated cube 12/24"

  tiers:
    basis: "the author, 2026-10-25: the eight tiers of _ARCHIVE, each a folder holding one kind of file. It revises the earlier six-part authority of axiomatic-sovereignty and setco (MUST, FACT, CLOSE, COMBINE, CONS, CONFIG; and setco -7 clauses, -8 modules): COMBINATORS is gone, EXPRESSIONS moves up to -3, and MACROS is new at -7"
    "-1":
      name: "RULES"
      folder: "_ARCHIVE/Rules"
      files: "*.hs"
      language: "Haskell"
    "-2":
      name: "FACTS"
      folder: "_ARCHIVE/Facts"
      files: "*.v"
      language: "Coq"
    "-3":
      name: "EXPRESSIONS"
      folder: "_ARCHIVE/Expressions"
      files: "*.js"
      language: "JavaScript"
    "-4":
      name: "CLOSURES"
      folder: "_ARCHIVE/Closures"
      files: "*.h"
      language: "C headers"
    "-5":
      name: "CONSTRUCTS"
      folder: "_ARCHIVE/Constructs"
      files: "*.c"
      language: "C"
    "-6":
      name: "CONFIGURATIONS"
      folder: "_ARCHIVE/Configurations"
      files: "*.yaml"
      language: "YAML"
    "-7":
      name: "MACROS"
      folder: "_ARCHIVE/Macros"
      files: "*.sh"
      language: "shell"
    "-8":
      name: "MODULES"
      folder: "_ARCHIVE/Modules"
      files: "*.cmake"
      language: "CMake"

  states:
    basis: "proposed by Claude, 2026-10-25, not yet confirmed by the author: every entry is in one of three states, and agreement means pointing to the same state of the same entry"
    declared: "named in _CATALOG and not placed yet: possible"
    defined: "placed in _CODE by its literal: actual"
    checked: "backed by a check that holds every time it runs: necessary"

  templates:
    basis: "the author, 2026-10-25: a template is a strict modal operator; nothing changes but the strict logic overlay. The template is fixed; a mapping is the overlay; a transliteration applies the overlay and changes nothing else. The tool is _ARCHIVE/Expressions/transliterate.js"
    folder: "_TEMPLATES"
  buffers:
    basis: "every buffer is framed by a 12-byte head and a 4-byte tail: a MIME header (RFC 2045) whose first field is the tag literal and whose value is the path of provenance, then the raw body. The header is ASCII, so no transliteration maps it (T2). The tool is _ARCHIVE/Expressions/buffer.js"
    head: "ZIGUA-ROTH: , 12 bytes: 5A 49 47 55 41 2D 52 4F 54 48 3A 20"
    tail: "CR LF CR LF, 4 bytes: 0D 0A 0D 0A; in octal 015 012 015 012"
    reading: "the author, 2026-10-25: the space, and CR LF CR LF, are the deviation in the escaped sequence, where CR LF CR LF holds the octal base nibble"
    correspondence: "noted by Claude, 2026-10-25, not derived: 12 + 4 = 16 is the split I-129b checks (0x30-0x3F mod 12 is a full ring of 12 and a 4-tail); LF in octal is 012; a Horn clause is head :- body and a Lisp list is car (head) and cdr (tail)"
  axes:
    basis: "the author, 2026-10-25: a folder name is an array, one letter per axis; the letter is the one a name starts with, in literal collation"
    _CODICES: "four letters: [0] ALEPPO, [1] ROSETTA, [2] BEHISTUN, [3] LENINGRAD, each A-Z; a name like AAAA is a point where all four witnesses agree"
    _CODEX: "two letters: [0] CLAIM, [1] PROOF, each A-Z; a name like AA is a claim and its proof on the same letter"
    _CATALOG: "[A-Z]/[A-Z]/[a-z]: TERMS; the capital folders are a name's barrels, so a double-barreled name nests its second barrel under its first and the tree shows it"
    open: "not yet declared: how a name in a non-Latin script gets its A-Z letter, and what an axis holds when a witness lacks the passage (the surviving Aleppo Codex has no Genesis); LENINGRAD has nine letters, one over a tag"
  rules:
    - id: "S1"
      group: "sources"
      subject: "a source"
      predicate: "is listed in"
      object: "SOURCES.md, with its terms, before anything from it enters the codex"
      modality: "MUST"
    - id: "S2"
      group: "sources"
      subject: "every entry"
      predicate: "names"
      object: "its source and the edition it came through"
      modality: "MUST"
    - id: "S3"
      group: "sources"
      subject: "text under CC BY-SA"
      predicate: "is"
      object: "credited and shared alike"
      modality: "MUST"
    - id: "S4"
      group: "sources"
      subject: "the text of the Codex Sinaiticus transcription"
      predicate: "enters"
      object: "the codex"
      modality: "MUST_NOT"
    - id: "S5"
      group: "sources"
      subject: "a Codex Sinaiticus verse reference, or the fact that a reading differs"
      predicate: "enters"
      object: "the codex"
      modality: "MAY"
    - id: "S6"
      group: "sources"
      subject: "a verse number"
      predicate: "states"
      object: "the numbering it follows; this codex follows Sefaria's Hebrew numbering"
      modality: "MUST"
    - id: "S7"
      group: "sources"
      subject: "an entry"
      predicate: "gives"
      object: "the English verse number where it differs"
      modality: "SHOULD"
    - id: "L1"
      group: "literals"
      subject: "Hebrew text"
      predicate: "is normalized to"
      object: "Unicode NFC before any comparison"
      modality: "MUST"
    - id: "L2"
      group: "literals"
      subject: "the literal of a Hebrew word"
      predicate: "is"
      object: "its consonants, U+05D0 to U+05EA, kept apart from the vowel points and the accents"
      modality: "MUST"
    - id: "L3"
      group: "literals"
      subject: "a letter"
      predicate: "is kept"
      object: "as written, final forms included"
      modality: "MUST"
    - id: "L4"
      group: "literals"
      subject: "a fold, or any other reading"
      predicate: "is declared as"
      object: "a reading"
      modality: "MUST"
    - id: "L5"
      group: "literals"
      subject: "a reading"
      predicate: "is stated as"
      object: "the literal"
      modality: "MUST_NOT"
    - id: "L6"
      group: "literals"
      subject: "an unassigned code point"
      predicate: "is given"
      object: "a meaning"
      modality: "MUST_NOT"
    - id: "P1"
      group: "placement"
      subject: "a name"
      predicate: "is placed by"
      object: "its literal, one code point per letter"
      modality: "MUST"
    - id: "P2"
      group: "placement"
      subject: "a code point"
      predicate: "is placed at"
      object: "_CODE/U, then its value in hex: a two-digit pair, then one digit per folder (U+05D9 is _CODE/U/05/D/9; U+28A3 is _CODE/U/28/A/3)"
      modality: "MUST"
    - id: "P3"
      group: "placement"
      subject: "an Aegean path"
      predicate: "is read"
      object: "one code point per segment, a separator and then a numeral (_CODE/U/10102/10124 is the check mark, then three thousand)"
      modality: "MUST"
    - id: "P4"
      group: "placement"
      subject: "a concept that cannot be placed"
      predicate: "stays"
      object: "declared"
      modality: "MUST"
    - id: "P5"
      group: "placement"
      subject: "the entry of a concept not yet placed"
      predicate: "says"
      object: "how it relates to what is already placed"
      modality: "MUST"
    - id: "C1"
      group: "catalog"
      subject: "an entry"
      predicate: "refers to"
      object: "an actual entity"
      modality: "MUST"
    - id: "C2"
      group: "catalog"
      subject: "a hash, a number standing in for something, or a string empty of meaning"
      predicate: "is"
      object: "an entry"
      modality: "MUST_NOT"
    - id: "C3"
      group: "catalog"
      subject: "an entry"
      predicate: "is"
      object: "a path of its name's barrels, one capital folder per barrel, ending in one file named by its last barrel in lower case with .yaml: _CATALOG/YHWH/yhwh.yaml, _CATALOG/YHWH/ELOHIM/elohim.yaml"
      modality: "MUST"
    - id: "C4"
      group: "catalog"
      subject: "the top key of an entry"
      predicate: "is"
      object: "the entity's name"
      modality: "MUST"
    - id: "C5"
      group: "catalog"
      subject: "every key and value of an entry"
      predicate: "loads as"
      object: "a string, also under YAML 1.1"
      modality: "MUST"
    - id: "C6"
      group: "catalog"
      subject: "a key in an entry"
      predicate: "is"
      object: "a single word"
      modality: "MUST"
    - id: "C7"
      group: "catalog"
      subject: "a concept that needs more than one word"
      predicate: "is given"
      object: "child files"
      modality: "MUST"
    - id: "C8"
      group: "catalog"
      subject: "an entry"
      predicate: "says, in natural language,"
      object: "what the entity is, where it was taken from, and how it went into the codex"
      modality: "MUST"
    - id: "C9"
      group: "catalog"
      subject: "an example"
      predicate: "becomes"
      object: "an entry"
      modality: "MUST_NOT"
    - id: "C10"
      group: "catalog"
      subject: "what the sources contain"
      predicate: "becomes"
      object: "an entry"
      modality: "MAY"
    - id: "N1"
      group: "names"
      subject: "a tag"
      predicate: "matches"
      object: "/^[A-Z0-9]{1,8}$/"
      modality: "MUST"
    - id: "N2"
      group: "names"
      subject: "a folder that builds the codex"
      predicate: "begins with"
      object: "an underscore"
      modality: "MUST"
    - id: "N3"
      group: "names"
      subject: "a folder without an underscore"
      predicate: "becomes"
      object: "the public, lowercase standard for paths, URIs and commands"
      modality: "MAY"
    - id: "N4"
      group: "names"
      subject: "a character outside /A-Za-z0-9/"
      predicate: "delimits"
      object: "a path"
      modality: "MAY"
    - id: "N5"
      group: "names"
      subject: "a path with its lowercase letters removed"
      predicate: "leaves"
      object: "the constant path"
      modality: "MUST"
    - id: "R1"
      group: "records"
      subject: "a prediction"
      predicate: "is written down"
      object: "before the check that tests it runs"
      modality: "MUST"
    - id: "R2"
      group: "records"
      subject: "a check that fails"
      predicate: "is recorded as"
      object: "failing"
      modality: "MUST"
    - id: "R3"
      group: "records"
      subject: "a failing check"
      predicate: "is weakened or deleted"
      object: "to hide the failure"
      modality: "MUST_NOT"
    - id: "R4"
      group: "records"
      subject: "a correction"
      predicate: "is"
      object: "a new commit carrying a dated note"
      modality: "MUST"
    - id: "R5"
      group: "records"
      subject: "the version a correction replaces"
      predicate: "stays in"
      object: "the history"
      modality: "MUST"
    - id: "R6"
      group: "records"
      subject: "the full skeleton"
      predicate: "stays"
      object: "local; a branch enters git when it is filled"
      modality: "MAY"
    - id: "T1"
      group: "templates"
      subject: "a transliteration"
      predicate: "changes"
      object: "the template's file"
      modality: "MUST_NOT"
    - id: "T2"
      group: "templates"
      subject: "a transliteration"
      predicate: "changes"
      object: "the template's ASCII, U+0000 to U+007F, which is its syntax"
      modality: "MUST_NOT"
    - id: "T3"
      group: "templates"
      subject: "a transliteration"
      predicate: "changes"
      object: "only the code points its mapping names"
      modality: "MUST"
    - id: "T4"
      group: "templates"
      subject: "a mapping"
      predicate: "is"
      object: "a static file of quoted code-point pairs, \"U+XXXX\": \"U+XXXX\", each code point mapped once"
      modality: "MUST"
    - id: "T5"
      group: "templates"
      subject: "the output of a transliteration"
      predicate: "is checked against"
      object: "its template: the same length in code points, and every change a mapped one"
      modality: "MUST"
    - id: "T6"
      group: "templates"
      subject: "a template"
      predicate: "writes as literal characters"
      object: "every glyph it means to have mapped"
      modality: "SHOULD"
    - id: "B1"
      group: "buffers"
      subject: "every buffer"
      predicate: "begins with"
      object: "the 12 bytes ZIGUA-ROTH: , then its path of provenance and CR LF"
      modality: "MUST"
    - id: "B2"
      group: "buffers"
      subject: "the header of a buffer"
      predicate: "is"
      object: "ASCII only; any other code point in it is written as U+XXXX"
      modality: "MUST"
    - id: "B3"
      group: "buffers"
      subject: "the header of a buffer"
      predicate: "carries"
      object: "MIME-Version: 1.0, Content-Type, Content-Transfer-Encoding: binary, Content-Length, and a Content-Description naming the source, edition, reference and terms"
      modality: "MUST"
    - id: "B4"
      group: "buffers"
      subject: "the header of a buffer"
      predicate: "ends with"
      object: "the 4 bytes CR LF CR LF"
      modality: "MUST"
    - id: "B5"
      group: "buffers"
      subject: "the body of a buffer"
      predicate: "is changed from"
      object: "what the source gave"
      modality: "MUST_NOT"
    - id: "B6"
      group: "buffers"
      subject: "a buffer whose body is not Content-Length bytes long"
      predicate: "is"
      object: "rejected"
      modality: "MUST"
    - id: "B7"
      group: "buffers"
      subject: "a buffer"
      predicate: "is encoded as"
      object: "base64, for a channel that cannot carry raw bytes"
      modality: "MAY"
    - id: "C11"
      group: "catalog"
      subject: "a double-barreled name"
      predicate: "nests"
      object: "its second barrel as a folder under its first"
      modality: "MUST"
    - id: "C12"
      group: "catalog"
      subject: "a barrel"
      predicate: "is"
      object: "a tag, /^[A-Z0-9]{1,8}$/, and a term file's name is lower case"
      modality: "MUST"
