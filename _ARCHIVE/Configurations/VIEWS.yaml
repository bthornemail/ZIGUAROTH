"VIEWS":
  title: "ZIGUAROTH: the views that resolve a _CODE folder, kept beside each other"
  status: "draft, 2026-10-27"
  author: "Brian James Thorne"
  principle: "the author, 2026-10-27: \"The reading for the folder mapping is dependent on view, dependent on resolve\"; then \"this is the exact structure we were reaching for, a dissolution of time and meaning to literal code point tree sequences\""
  tier: "-6, CONFIGURATIONS: _ARCHIVE/Configurations, *.yaml"
  literal: "a folder's name is its code point (or, for a two-digit pair, its block); it is the literal, and no view renames it (V1)"
  check: "node _ARCHIVE/Expressions/views.js"

  views:
    "TIMELINE":
      basis: "the author, 2026-10-25 (rules Y1, Y2)"
      source: "Longstaff, Calendars from around the world (the astronomical index); the atomic kernel clock (logical time)"
    "EULER":
      basis: "proposed by another assistant, pasted by the author 2026-10-27; kept by the author as a view the same day"
      source: "Wikipedia, Simple precedence grammar (the Wirth-Weber relations, from Wirth and Weber, EULER: A Generalization of ALGOL, and its Formal Definition, 1966); Christopher, EULER: An Experiment in Language Definition, 1996, cited only"
      note: "Wirth-Weber has three relations; $ is not a relation but the limit marker at both ends of the parse, so this view puts three relations and one marker on four folders. The relation signs are U+22D6 LESS-THAN WITH DOT, U+2250 APPROACHES THE LIMIT, U+22D7 GREATER-THAN WITH DOT"

  folders:
    "10100":
      literal: "U+10100 AEGEAN WORD SEPARATOR LINE"
      "TIMELINE": "-1, 2 BC"
      "EULER": "$, the limit marker: the stack starts with it, the input ends with it"
    "10101":
      literal: "U+10101 AEGEAN WORD SEPARATOR DOT"
      "TIMELINE": "0, 1 BC"
      "EULER": "⋖, a potential pivot is starting: shift"
    "10102":
      literal: "U+10102 AEGEAN CHECK MARK"
      "TIMELINE": "+1, AD 1"
      "EULER": "≐, a relationship remains in the same pivot: shift"
    "28":
      literal: "the pair 28: the braille block, U+2800 BRAILLE PATTERN BLANK to U+28FF BRAILLE PATTERN DOTS-12345678"
      "TIMELINE": "logical time, the units of the atomic kernel clock (the Delta Law), not calendar years"
      "EULER": "⋗, the pivot is found: reduce"
